# Подключение встроенного ИИ-чата к OpenRouter (https://openrouter.ai/api/v1).
# API-ключ в репозиторий НЕ записываем: задайте переменную окружения OPENROUTER_API_KEY.
# Ключ берётся бесплатно на https://openrouter.ai/keys и используется только для
# моделей с суффиксом :free (оплата не требуется).
# Любой параметр можно переопределить переменной окружения:
#   OPENROUTER_API_KEY, OPENROUTER_MODEL, OPENROUTER_BASE_URL
#
# Модель можно не указывать: если поле пустое, приложение само выберет первую
# бесплатную из каталога OpenRouter (бесплатный каталог меняется, поэтому идентификатор
# в код не зашит).
openrouter.base.url=https://openrouter.ai/api/v1
openrouter.api.key=
openrouter.model=
