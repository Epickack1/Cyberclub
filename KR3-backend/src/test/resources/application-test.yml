spring:
  datasource:
    url: jdbc:h2:mem:cyberclub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # В тестах схема строится по сущностям: миграции используют возможности PostgreSQL.
      ddl-auto: create-drop
  flyway:
    enabled: false
