spring:
  application:
    name: cyberclub-backend
  datasource:
    # По умолчанию — та же база, что у десктопного приложения КР2,
    # иначе ИИ через REST менял бы данные, которых не видно в окне программы.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cyberclub}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      # Схему создаёт и меняет только Flyway, Hibernate её лишь проверяет.
      ddl-auto: validate
  flyway:
    enabled: true
    # На базе, которую раньше создало приложение КР2, истории Flyway нет.
    # V1 (схема) и V2 (демо-данные) считаются уже применёнными — таблицы и данные
    # на месте, — а V3 доводит схему до требований КР3. Дальше V4 и V5 добавляют пользователей.
    baseline-on-migrate: true
    baseline-version: 2
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  # Окончательное удаление брони выключено по умолчанию (в КР3 — только администратор).
  permanent-delete-enabled: ${PERMANENT_DELETE_ENABLED:false}
  # Время брони хранится как местное время клуба.
  time-zone: ${APP_TIME_ZONE:Europe/Moscow}
  security:
    # Ключ подписи JWT (Base64, не меньше 32 байт). Если пустой — генерируется при запуске,
    # и после перезапуска сервера все пользователи входят заново.
    jwt-secret-base64: ${JWT_SECRET_BASE64:}
    jwt-issuer: ${JWT_ISSUER:cyberclub}
    access-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-days: ${REFRESH_TOKEN_DAYS:14}
    # Защита от перебора паролей: после N неудачных попыток вход блокируется на lock-minutes.
    max-failed-logins: ${MAX_FAILED_LOGINS:5}
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}
    # Первый администратор создаётся при запуске, если в базе ещё нет ни одного пользователя.
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-name: ${BOOTSTRAP_ADMIN_NAME:Администратор клуба}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
