# Источник данных JavaFX-приложения CyberClub.
#   rest — через собственный REST API (папка cyberclub-backend, запускается первым): JavaFX → REST → Spring Boot → PostgreSQL
#   jdbc — напрямую к базе КР1 через JDBC, параметры в database.properties (так требует КР2)
# Переопределяется переменными окружения CYBERCLUB_DATA_MODE и CYBERCLUB_API_URL.
data.mode=rest
api.url=http://localhost:8082/api

# Вход сотрудников и регистрация пользователей — через сервер КР3 (KR3-backend, порт 8081).
#   auth.enabled=true  — при запуске окно входа; администратору доступна вкладка «Пользователи»
#   auth.enabled=false — приложение открывается сразу, без входа (как в КР2)
# Переопределяется переменными окружения CYBERCLUB_AUTH_ENABLED и CYBERCLUB_AUTH_URL.
auth.enabled=true
auth.url=http://localhost:8081/api
