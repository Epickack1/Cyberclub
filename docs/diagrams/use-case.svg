<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1300" height="620" fill="white"/>
  <text x="650" y="40" text-anchor="middle" font-size="24" fill="#1a2340">Диаграмма прецедентов (Use Case) — CyberClub</text>
  <text x="650" y="66" text-anchor="middle" font-size="14" fill="#5c6b8a">Актор: Оператор клуба. Источник — пункты главного меню (MainMenu.java)</text>

  <!-- system boundary -->
  <rect x="260" y="100" width="980" height="480" rx="14" fill="#f7f9fc" stroke="#33415c" stroke-width="2"/>
  <text x="750" y="130" text-anchor="middle" font-size="16" fill="#1a2340" font-weight="bold">Система «CyberClub» (консольное приложение)</text>

  <!-- actor -->
  <g stroke="#1a2340" stroke-width="2.5" fill="none">
    <circle cx="110" cy="220" r="20" fill="#eaf6fb"/>
    <line x1="110" y1="240" x2="110" y2="310"/>
    <line x1="70" y1="265" x2="150" y2="265"/>
    <line x1="110" y1="310" x2="80" y2="360"/>
    <line x1="110" y1="310" x2="140" y2="360"/>
  </g>
  <text x="110" y="385" text-anchor="middle" font-size="14" fill="#1a2340" font-weight="bold">Оператор</text>
  <text x="110" y="402" text-anchor="middle" font-size="12" fill="#5c6b8a">клуба</text>

  <!-- use case ellipses helper -->
  <!-- Row 1 -->
  <g>
    <ellipse cx="480" cy="170" rx="140" ry="38" fill="#bde0ee" stroke="#33415c" stroke-width="1.4"/>
    <text x="480" y="166" text-anchor="middle" font-size="13" fill="#023047">Управлять клиентами</text>
    <text x="480" y="183" text-anchor="middle" font-size="11" fill="#023047">(CRUD, поиск по нику/ФИО)</text>
  </g>
  <g>
    <ellipse cx="760" cy="170" rx="150" ry="38" fill="#bde0ee" stroke="#33415c" stroke-width="1.4"/>
    <text x="760" y="166" text-anchor="middle" font-size="13" fill="#023047">Управлять игровыми местами</text>
    <text x="760" y="183" text-anchor="middle" font-size="11" fill="#023047">(CRUD, перевод на обслуживание)</text>
  </g>
  <g>
    <ellipse cx="1060" cy="170" rx="145" ry="38" fill="#bde0ee" stroke="#33415c" stroke-width="1.4"/>
    <text x="1060" y="166" text-anchor="middle" font-size="13" fill="#023047">Настроить тему оформления</text>
    <text x="1060" y="183" text-anchor="middle" font-size="11" fill="#023047">(светлая / тёмная / без цвета)</text>
  </g>

  <!-- Row 2: booking core -->
  <g>
    <ellipse cx="600" cy="290" rx="180" ry="42" fill="#ffd166" stroke="#33415c" stroke-width="1.4"/>
    <text x="600" y="284" text-anchor="middle" font-size="14" fill="#7a4a00" font-weight="bold">Управлять бронированиями</text>
    <text x="600" y="302" text-anchor="middle" font-size="11" fill="#7a4a00">создать / изменить / сменить статус / удалить</text>
  </g>

  <!-- include arrows to sub use cases of booking -->
  <g>
    <ellipse cx="850" cy="290" rx="120" ry="36" fill="#fff1cc" stroke="#33415c" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="850" y="286" text-anchor="middle" font-size="12" fill="#7a4a00">Проверить пересечение</text>
    <text x="850" y="301" text-anchor="middle" font-size="11" fill="#7a4a00">брони по месту/времени</text>
  </g>
  <g>
    <ellipse cx="1080" cy="290" rx="110" ry="36" fill="#fff1cc" stroke="#33415c" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="1080" y="286" text-anchor="middle" font-size="12" fill="#7a4a00">Рассчитать стоимость</text>
    <text x="1080" y="301" text-anchor="middle" font-size="11" fill="#7a4a00">брони по тарифу места</text>
  </g>
  <line x1="720" y1="290" x2="740" y2="290" stroke="#33415c" stroke-dasharray="4,3"/>
  <text x="770" y="272" font-size="10" fill="#5c6b8a" font-style="italic">&#171;include&#187;</text>
  <line x1="960" y1="290" x2="978" y2="290" stroke="#33415c" stroke-dasharray="4,3"/>
  <text x="965" y="272" font-size="10" fill="#5c6b8a" font-style="italic">&#171;include&#187;</text>

  <!-- Row 3: search / filter / sort -->
  <g>
    <ellipse cx="420" cy="410" rx="130" ry="36" fill="#e2eaf0" stroke="#33415c" stroke-width="1.2"/>
    <text x="420" y="415" text-anchor="middle" font-size="13" fill="#1a2340">Искать бронирования</text>
  </g>
  <g>
    <ellipse cx="660" cy="410" rx="130" ry="36" fill="#e2eaf0" stroke="#33415c" stroke-width="1.2"/>
    <text x="660" y="415" text-anchor="middle" font-size="13" fill="#1a2340">Фильтровать бронирования</text>
  </g>
  <g>
    <ellipse cx="900" cy="410" rx="130" ry="36" fill="#e2eaf0" stroke="#33415c" stroke-width="1.2"/>
    <text x="900" y="415" text-anchor="middle" font-size="13" fill="#1a2340">Сортировать бронирования</text>
  </g>

  <!-- Row 4: stats / export / db tables -->
  <g>
    <ellipse cx="470" cy="530" rx="140" ry="38" fill="#8fe3c7" stroke="#33415c" stroke-width="1.4"/>
    <text x="470" y="535" text-anchor="middle" font-size="13" fill="#04543f">Просматривать статистику</text>
  </g>
  <g>
    <ellipse cx="760" cy="530" rx="150" ry="38" fill="#e2eaf0" stroke="#33415c" stroke-width="1.2"/>
    <text x="760" y="524" text-anchor="middle" font-size="13" fill="#1a2340">Экспортировать данные</text>
    <text x="760" y="541" text-anchor="middle" font-size="10.5" fill="#5c6b8a">(Excel / CSV)</text>
  </g>
  <g>
    <ellipse cx="1050" cy="530" rx="150" ry="38" fill="#e2eaf0" stroke="#33415c" stroke-width="1.2"/>
    <text x="1050" y="524" text-anchor="middle" font-size="13" fill="#1a2340">Просматривать структуру БД</text>
    <text x="1050" y="541" text-anchor="middle" font-size="10.5" fill="#5c6b8a">(таблицы, DatabaseMetaData)</text>
  </g>

  <!-- actor connections -->
  <g stroke="#1a2340" stroke-width="1.3" fill="none">
    <line x1="130" y1="235" x2="340" y2="170"/>
    <line x1="130" y1="245" x2="420" y2="290"/>
    <line x1="130" y1="255" x2="300" y2="410"/>
    <line x1="130" y1="270" x2="330" y2="530"/>
    <line x1="130" y1="280" x2="610" y2="530"/>
    <line x1="130" y1="290" x2="900" y2="530"/>
    <line x1="130" y1="300" x2="1060" y2="132"/>
  </g>

  <!-- footer legend -->
</svg>
